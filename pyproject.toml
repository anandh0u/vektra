[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "vektra-cli"
version = "1.0.0"
description = "Command-line interface for the VEKTRA security intelligence platform"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]

[project.scripts]
vektra = "backend.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]
